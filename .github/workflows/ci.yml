name: "scan-shuffle ci"

on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install markdownlint
        run: npm install --global markdownlint-cli

      - name: Check Markdown formatting
        run: markdownlint --config .markdownlint.yaml '**/*.md'

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: ./.github/actions/setup-java

      - name: Run unit-tests
        run: ./gradlew test -PexcludeTestTags=requires-infrastructure

  check-pr-docker-images:
    needs:
      - unit-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: ./.github/actions/setup-java

      - name: Build application JAR
        run: ./gradlew bootJar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Docker image build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64

  build-docker-images:
    needs:
      - unit-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: ./.github/actions/setup-java

      - name: Build application JAR
        run: ./gradlew bootJar

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Load Docker Hub credentials from Doppler
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_DOCKERHUB_TOKEN }}
        run: .github/scripts/prepare-dockerhub-creditials.sh

      - name: Setup Docker
        uses: ./.github/actions/setup-docker
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          token: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            scobca/scan-shuffle:latest
            scobca/scan-shuffle:sha-${{ github.sha }}
          platforms: linux/amd64,linux/arm64

  deploy-production-containers:
    name: Deploy updated production-images to server
    needs:
      - build-docker-images

    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'main'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        run: .github/scripts/setup-ssh.sh
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Pull images and recreate services
        env:
          SERVER_HOST: ${{ secrets.SSH_HOST }}
          SERVER_USER: ${{ secrets.SSH_USER }}
        run: .github/scripts/pull-images.sh

  publish-release:
    needs:
      - markdown-formatting
      - unit-tests
      - build-docker-images
      - deploy-production-containers

    runs-on: ubuntu-latest
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Create version tag
        id: tag
        run: .github/scripts/tag-release.sh

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release v${{ steps.tag.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
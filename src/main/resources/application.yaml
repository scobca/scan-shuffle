spring:
  application:
    name: scan-shuffle

  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

jwt:
  secret-base64: ${SECRET_BASE64}

database:
  url: ${DB_URL}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  schema: public

services:
  frontend-local: ${FRONTEND_LOCAL_HOST}
  frontend-production: ${FRONTEND_PRODUCTION_HOST}

server:
  port: 8080